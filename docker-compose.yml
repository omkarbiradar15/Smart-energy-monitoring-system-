version: '3.8'

services:
  smart-energy-monitor:
    build: .
    container_name: smart_energy_monitor_app
    restart: always
    ports:
      - "8000:8000"
      - "8081:8081"
    environment:
      - DATABASE_URL=sqlite:////app/database/energy_monitor.db
      - SECRET_KEY=smart-energy-monitoring-production-key-2026
    volumes:
      - db_data:/app/database

volumes:
  db_data:
